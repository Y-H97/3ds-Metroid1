name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'LevelEditor/**'

jobs:
  export-maps:
    name: LevelEditor → Export (Validierung)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Exportiere Level und validiere JSON
        run: |
          python LevelEditor/export_maps.py

  german-comments:
    name: Prüfe deutsche Kommentare (Regel)
    runs-on: ubuntu-latest
    needs: export-maps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Prüfe geänderte Dateien auf deutsche Kommentare
        run: |
          # Das Skript erkennt automatisch geänderte Dateien gegenüber origin/main.
          python scripts/check_german_comments.py
